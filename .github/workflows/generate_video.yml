
name: Generate Chess Video

on:
  workflow_dispatch:
    inputs:
      moves:
        description: Number of half-moves
        type: number
        default: 24
        required: true

      seconds_per_move:
        description: Seconds per chess position
        type: string
        default: '1.65'
        required: true

      publish:
        description: Publish to YouTube
        type: boolean
        default: true
        required: true

      privacy:
        description: YouTube visibility
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public
        required: true

  push:
    branches: [Production]
    paths:
      - 'generate_chess_short.py'
      - 'upload_chess_youtube.py'
      - 'requirements-chess.txt'
      - '.github/workflows/generate-chess-video.yml'

permissions:
  contents: read

jobs:
  generate_video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg stockfish libcairo2 fonts-dejavu-core

          python -m pip install --upgrade pip
          python -m pip install -r requirements-chess.txt

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2

          test -x /usr/games/stockfish

      - name: Generate chess video
        env:
          MOVES: ${{ inputs.moves || 24 }}
          SECONDS_PER_MOVE: ${{ inputs.seconds_per_move || '1.65' }}
        run: |
          python generate_chess_short.py \
            --stockfish /usr/games/stockfish \
            --moves "$MOVES" \
            --seconds-per-move "$SECONDS_PER_MOVE" \
            --output output.mp4 \
            --pgn random_game.pgn

          test -s output.mp4
          test -s random_game.pgn

      - name: Verify YouTube credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for key in YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done

          echo "YouTube OAuth secrets configured."

      - name: Publish chess Short to YouTube
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy }}
        run: |
          python upload_chess_youtube.py \
            --video output.mp4 \
            --pgn random_game.pgn \
            --privacy "$YT_PRIVACY"

      - name: Upload video and PGN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-short-${{ github.run_id }}
          path: |
            output.mp4
            random_game.pgn
            youtube-upload.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
