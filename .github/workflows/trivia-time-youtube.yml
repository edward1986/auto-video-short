name: Trivia Time - Generate and Publish YouTube Short

on:
  schedule:
    - cron: '10 1 * * *' # Daily at 09:10 Philippine time (UTC+8)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional curated category: science, animals, space, geography, nature, history'
        required: false
        default: ''
        type: string
      use_ai:
        description: 'Generate a new question using AI (requires fact review for accuracy)'
        required: false
        default: false
        type: boolean
      privacy:
        description: 'YouTube visibility: public, private, unlisted'
        required: true
        default: private
        type: choice
        options:
          - private
          - unlisted
          - public

permissions:
  contents: read

concurrency:
  group: trivia-time-youtube
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_IMAGE_MODEL: '@cf/black-forest-labs/flux-1-schnell'
      CF_TEXT_MODEL: '@cf/meta/llama-3.1-8b-instruct'
      TRIVIA_TOPIC: ${{ inputs.topic }}
      TRIVIA_USE_AI: ${{ inputs.use_ai || 'false' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: ${{ github.event_name == 'schedule' && 'public' || inputs.privacy }}
      KOKORO_DIR: ${{ github.workspace }}/.cache/kokoro
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-trivia.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core curl

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-trivia.txt

      - name: Generate trivia spec
        run: python auto_trivia_spec.py jobs/trivia/spec.json

      - name: Generate illustration with Cloudflare FLUX
        run: python gen_images.py jobs/trivia

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-voice-v1.0-int8

      - name: Download Kokoro model when needed
        run: |
          set -euo pipefail
          mkdir -p "$KOKORO_DIR"
          BASE='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0'
          if [ ! -s "$KOKORO_DIR/kokoro-v1.0.int8.onnx" ]; then
            curl -fL --retry 4 --retry-delay 5 "$BASE/kokoro-v1.0.int8.onnx" -o "$KOKORO_DIR/kokoro-v1.0.int8.onnx"
          fi
          if [ ! -s "$KOKORO_DIR/voices-v1.0.bin" ]; then
            curl -fL --retry 4 --retry-delay 5 "$BASE/voices-v1.0.bin" -o "$KOKORO_DIR/voices-v1.0.bin"
          fi

      - name: Render vertical trivia short
        run: python trivia_render.py jobs/trivia/spec.json render_output

      - name: Validate output
        id: result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          spec = json.loads(Path('jobs/trivia/spec.json').read_text())
          video = Path('render_output')/(spec['slug']+'.mp4')
          if not video.exists() or video.stat().st_size < 10000:
              raise SystemExit('Missing or empty video')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'video={video}\n')
          print('Video ready:', video, video.stat().st_size)
          PY

      - name: Upload render to Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivia-time-${{ github.run_id }}
          path: |
            jobs/trivia/spec.json
            jobs/trivia/*.png
            render_output/*.mp4
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Publish Short on YouTube
        run: python upload_youtube.py jobs/trivia/spec.json '${{ steps.result.outputs.video }}'

      - name: Store YouTube upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-result-${{ github.run_id }}
          path: youtube-upload.json
          retention-days: 7
          if-no-files-found: ignore
