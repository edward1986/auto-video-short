name: Auto Video Short

on:
  push:
    branches:
      - Production
  pull_request:
    branches:
      - Production
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AUDIO_NAME: "audio.mp3"
      VIDEO_NAME: "video.mp4"
      FINAL_VIDEO: "final_video.mp4"
      VIDEOURL: ${{ secrets.VIDEOURL }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        df -h
        sudo apt-get update
        sudo apt-get install -y ttf-mscorefonts-installer
        sudo apt-get install -y imagemagick ghostscript
        sudo apt-get install -y curl jq
        python -m pip install --upgrade pip
        pip install oauth2client
        pip install mysql-connector-python
        pip install torch torchvision torchaudio
        pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
        pip install -r requirements.txt

    - name: Fetch Word of the Day
      id: fetch_word_of_the_day
      run: |
        url="https://www.merriam-webster.com/word-of-the-day"
        response=$(curl -s -o /tmp/response.html -w "%{http_code}" $url)

        if [ "$response" -eq 200 ]; then
          word=$(grep -oP '(?<=<h2 class="word-header-txt">)[^<]+' /tmp/response.html | head -n 1 | xargs)

          if [ -n "$word" ]; then
            echo "Word of the Day fetched successfully: $word"
            echo "word=$word" >> $GITHUB_ENV
          else
            echo "Word of the Day not found in the HTML content"
            echo "word=word" >> $GITHUB_ENV
          fi
        else
          echo "Failed to retrieve the Word of the Day, HTTP status: $response"
          echo "word=word" >> $GITHUB_ENV
        fi

    - name: Generate Blog Using Cloudflare AI Worker
      id: generate_blog
      env:
        CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        # OPTIONAL if you protected the Worker with APP_API_KEY:
        APP_API_KEY: ${{ secrets.APP_API_KEY }}
      run: |
        if [ -z "$CF_WORKER_URL" ]; then
          echo "Missing secret CF_WORKER_URL"
          exit 1
        fi

        response=$(curl -s https://catfact.ninja/fact | jq -r '.fact')
        sanitized_response=$(echo "$response" | sed 's/[^a-zA-Z0-9 .,!?-]//g')

        prompt="$sanitized_response make a blog and use the word ${{ env.word }}"

        payload=$(jq -n \
          --arg input "$prompt" \
          --arg instructions "Write a short blog. Use simple English. Keep it clear and natural." \
          --arg model "@cf/meta/llama-4-scout-17b-16e-instruct" \
          --argjson max_output_tokens 256 \
          '{input:$input, instructions:$instructions, model:$model, max_output_tokens:$max_output_tokens}')

        # If you DID NOT set APP_API_KEY on the worker, remove the -H "X-APP-KEY..." line.
        result=$(curl -s -X POST "$CF_WORKER_URL" \
          -H "Content-Type: application/json" \
          -H "X-APP-KEY: $APP_API_KEY" \
          -d "$payload")

        # Try multiple common response shapes
        blog=$(
          echo "$result" | jq -r '
            (.. | .response? // empty) as $r
            | if ($r|type)=="string" and ($r|length)>0 then $r else empty end
          ' | head -n 1
        )

        if [ -z "$blog" ] || [ "$blog" = "null" ]; then
          # fallback: sometimes it is under result.response or result.output_text, etc.
          blog=$(echo "$result" | jq -r '.result.response? // .result? // .response? // empty' | head -n 1)
        fi

        if [ -z "$blog" ] || [ "$blog" = "null" ]; then
          echo "Cloudflare Worker raw response:"
          echo "$result"
          exit 1
        fi

        sanitized_blog=$(echo "$blog" | tr -d '\n' | tr -d '\r' | sed 's/[^a-zA-Z0-9 .,!?-]//g')
        echo "cat_fact=$sanitized_blog" >> $GITHUB_ENV

    - name: Update ImageMagick policy
      run: |
        if [ -f /etc/ImageMagick-7/policy.xml ]; then
          POLICY_FILE="/etc/ImageMagick-7/policy.xml"
        elif [ -f /etc/ImageMagick-6/policy.xml ]; then
          POLICY_FILE="/etc/ImageMagick-6/policy.xml"
        else
          echo "No ImageMagick policy.xml file found."
          exit 1
        fi
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' $POLICY_FILE || true
        sudo sed -i 's/<policy domain="coder" rights="none" pattern="PS"/<!-- <policy domain="coder" rights="none" pattern="PS" -->/' $POLICY_FILE || true
        sudo sed -i 's/<policy domain="coder" rights="none" pattern="EPI"/<!-- <policy domain="coder" rights="none" pattern="EPI" -->/' $POLICY_FILE || true
        sudo sed -i 's/<policy domain="coder" rights="none" pattern="URL"/<!-- <policy domain="coder" rights="none" pattern="URL" -->/' $POLICY_FILE || true
        sudo sed -i 's/<policy domain="coder" rights="none" pattern="MVG"/<!-- <policy domain="coder" rights="none" pattern="MVG" -->/' $POLICY_FILE || true
        sudo sed -i 's/<policy domain="coder" rights="none" pattern="MSL"/<!-- <policy domain="coder" rights="none" pattern="MSL" -->/' $POLICY_FILE || true
        sudo sed -i 's/<policy domain="coder" rights="none" pattern="PDF"/<!-- <policy domain="coder" rights="none" pattern="PDF" -->/' $POLICY_FILE || true

    - name: Run script
      env:
        MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
        MYSQL_USER: ${{ secrets.MYSQL_USER }}
        MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      run: |
        export CAT_FACT="${{ env.cat_fact }}"
        python main.py --max_tokens 100

    - name: Load Environment Variables Safely
      run: |
        set -a
        source .env
        set +a

    - name: Generate YouTube Metadata
      run: |
        echo "YOUTUBE_TITLE=${YOUTUBE_TITLE}" >> $GITHUB_ENV
        echo "YOUTUBE_DESCRIPTION=${YOUTUBE_DESCRIPTION}" >> $GITHUB_ENV
        echo "YOUTUBE_TAGS=${YOUTUBE_TAGS}" >> $GITHUB_ENV
        echo "YOUTUBE_CATEGORY_ID=${YOUTUBE_CATEGORY_ID}" >> $GITHUB_ENV
        echo "YOUTUBE_PRIVACY_STATUS=${YOUTUBE_PRIVACY_STATUS}" >> $GITHUB_ENV
        echo "YOUTUBE_VIDEO_ID=${YOUTUBE_VIDEO_ID}" >> $GITHUB_ENV

    - name: Commit output files
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git fetch origin
        git pull origin Production --rebase
        git add -f .
        git commit -m "Add generated video files" || echo "No changes to commit"
        git push origin Production
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
