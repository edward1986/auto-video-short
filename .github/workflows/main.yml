name: Auto Video Short

on:
  push:
    branches:
      - Production
  pull_request:
    branches:
      - Production
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AUDIO_NAME: "audio.mp3"
      VIDEO_NAME: "video.mp4"
      FINAL_VIDEO: "final_video.mp4"
      VIDEOURL: ${{ secrets.VIDEOURL }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        df -h
        sudo apt-get update
        curl -fsSL https://ollama.com/install.sh | sh
        sudo apt-get update
        sudo apt-get install -y ttf-mscorefonts-installer imagemagick ghostscript curl jq
        python -m pip install --upgrade pip
        pip install oauth2client
        pip install torch torchvision torchaudio
        pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
        pip install -r requirements.txt

    - name: Verify Ollama Installation
      run: ollama --version

    - name: Kill Ollama Process (if running)
      continue-on-error: true
      run: |
        PID=$(sudo lsof -t -i:11434)
        if [ -n "$PID" ]; then
          echo "Killing existing Ollama process: $PID"
          sudo kill -9 $PID
        else
          echo "No Ollama process found."
        fi

    - name: Start Ollama Service
      run: |
        ollama serve &  # Run Ollama in the background
        sleep 10  # Give time for Ollama to start

    - name: Pull Llama Model
      run: |
        ollama pull llama3

    - name: Check Ollama Root Endpoint
      run: |
        until curl -s --head --request GET http://localhost:11434/ | grep "200 OK" > /dev/null; do 
          echo "Waiting for Ollama to be ready..."
          sleep 5
        done
        echo "Ollama is running!"

    - name: Fetch Word of the Day
      id: fetch_word_of_the_day
      run: |
        url="https://www.merriam-webster.com/word-of-the-day"
        response=$(curl -s -o /tmp/response.html -w "%{http_code}" $url)

        if [ "$response" -eq 200 ]; then
          word=$(grep -oP '(?<=<h2 class="word-header-txt">)[^<]+' /tmp/response.html | head -n 1 | xargs)
          
          if [ -n "$word" ]; then
            echo "Word of the Day: $word"
            echo "word=$word" >> $GITHUB_ENV
          else
            echo "Could not extract the Word of the Day."
            echo "word=default" >> $GITHUB_ENV
          fi
        else
          echo "Failed to retrieve the Word of the Day. HTTP status: $response"
          echo "word=default" >> $GITHUB_ENV
    
    - name: Generate Cat Fact Using Ollama API
      id: generate_cat_fact
      run: |
        response=$(curl -s https://catfact.ninja/fact | jq -r '.fact')
        sanitized_response=$(echo "$response" | sed 's/[^a-zA-Z0-9 .,!?-]//g')
        cat_fact=$(curl -s -X POST http://localhost:11434/api/generate -d "{\"model\": \"llama3\", \"prompt\": \"$sanitized_response make a long sentence and use the word ${{ env.word }}\"}" | jq -r '.response' | tr -d '\n' | tr -d '\r')
        sanitized_cat_fact=$(echo "$cat_fact" | sed 's/[^a-zA-Z0-9 .,!?-]//g')

        if [ -z "$sanitized_cat_fact" ]; then
          echo "Failed to generate cat fact. Using fallback."
          sanitized_cat_fact="Cats are wonderful creatures."
        fi

        echo "cat_fact=$sanitized_cat_fact" >> $GITHUB_ENV

    - name: Update ImageMagick policy
      run: |
        POLICY_FILE=$(find /etc -name "policy.xml" 2>/dev/null | head -n 1)
        if [ -f "$POLICY_FILE" ]; then
          echo "Updating ImageMagick policy at $POLICY_FILE"
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' $POLICY_FILE
        else
          echo "No ImageMagick policy.xml file found."
          exit 1
        fi

    - name: Stop Ollama Service and Clean Up
      continue-on-error: true
      run: |
        PID=$(sudo lsof -t -i:11434)
        if [ -n "$PID" ]; then
          echo "Stopping Ollama service..."
          sudo kill -9 $PID
        else
          echo "Ollama service not running."
        fi
        sudo rm -rf ~/.ollama  # Free up space

    - name: Run script
      run: |
        export CAT_FACT="${{ env.cat_fact }}"
        python main.py --max_tokens 100

    - name: Commit output files
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add -f output/*
        git commit -m "Add generated video files"
        git push origin Production
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
