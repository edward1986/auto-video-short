
name: Generate Video

on:
  push:
    branches:
      - Production
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-video
  cancel-in-progress: false

jobs:
  generate_video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Virtual Environment
        run: |
          python -m venv venv

      - name: Install Dependencies
        run: |
          source venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install --no-cache-dir \
            moviepy==1.0.3 \
            "numpy>=1.26.0,<2.0.0" \
            "Pillow>=10.1.0" \
            imageio \
            "imageio[ffmpeg]"

          python -m pip install \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            oauth2client \
            boto3 \
            python-dotenv \
            pyfiglet \
            transformers \
            gtts

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Configure ImageMagick
        run: |
          if [ -f /etc/ImageMagick-7/policy.xml ]; then
            POLICY_FILE="/etc/ImageMagick-7/policy.xml"
          elif [ -f /etc/ImageMagick-6/policy.xml ]; then
            POLICY_FILE="/etc/ImageMagick-6/policy.xml"
          else
            echo "ImageMagick policy not found"
            exit 1
          fi

          sudo sed -i \
            's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' \
            "$POLICY_FILE"

      - name: Fix MoviePy Pillow Compatibility
        run: |
          source venv/bin/activate

          python - <<'PY'
          import pathlib
          import moviepy

          resize_file = (
              pathlib.Path(moviepy.__file__).parent
              / "video"
              / "fx"
              / "resize.py"
          )

          source = resize_file.read_text()
          source = source.replace(
              "Image.ANTIALIAS",
              "Image.Resampling.LANCZOS"
          )
          resize_file.write_text(source)

          print("MoviePy Pillow compatibility applied")
          PY

      - name: Verify Dependencies
        run: |
          source venv/bin/activate

          python -m pip show moviepy Pillow
          python -c "from moviepy.editor import VideoFileClip; print('MoviePy OK')"

      - name: Generate Video
        run: |
          source venv/bin/activate
          python produce_short.py

      - name: Verify Generated Video
        run: |
          if [ ! -s output.mp4 ]; then
            echo "ERROR: output.mp4 missing or empty"
            exit 1
          fi

          ls -lh output.mp4

      - name: Upload Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_id }}
          path: output.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Cleanup Generated Files
        if: always()
        run: |
          rm -f output.mp4
          echo "Temporary generated video removed"
