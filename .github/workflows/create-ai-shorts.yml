name: Generate AI Short (Cloudflare + Kokoro)

on:
  schedule:
    - cron: '10 1 * * *' # Daily at 09:10 Asia/Manila (UTC+8)
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Optional existing spec path; leave blank to generate a story automatically'
        required: false
        default: ''
        type: string
      topic:
        description: 'Optional stickman comedy topic; empty uses an automatic rotating theme'
        required: false
        default: ''
        type: string
      output_name:
        description: 'Name for downloadable Actions artifact'
        required: false
        default: ai-short
        type: string

permissions:
  contents: read

concurrency:
  group: ai-short-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create_short:
    name: Generate stills, narration, and MP4
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_BACKUP_ACCOUNT_ID: ${{ secrets.CF_BACKUP_ACCOUNT_ID }}
      CF_BACKUP_API_TOKEN: ${{ secrets.CF_BACKUP_API_TOKEN }}
      CF_BACKUP_ACCOUNT_ID_2: ${{ secrets.CF_BACKUP_ACCOUNT_ID_2 }}
      CF_BACKUP_API_TOKEN_2: ${{ secrets.CF_BACKUP_API_TOKEN_2 }}
      CF_BACKUP_ACCOUNT_ID_3: ${{ secrets.CF_BACKUP_ACCOUNT_ID_3 }}
      CF_BACKUP_API_TOKEN_3: ${{ secrets.CF_BACKUP_API_TOKEN_3 }}
      KOKORO_DIR: ${{ github.workspace }}/.cache/kokoro
      PYTHONUNBUFFERED: '1'
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: public
      SHORTS_TOPIC: ${{ inputs.topic }}

    steps:
      - name: Checkout code and job assets
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-shorts.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-shorts.txt
          python -m pip install google-api-python-client google-auth google-auth-httplib2

      - name: Automatically generate spec when none is supplied
        if: ${{ inputs.spec_path == '' }}
        run: |
          python auto_spec.py jobs/auto/spec.json

      - name: Check job spec and scripts
        id: paths
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path.cwd().resolve()
          supplied = os.environ['SPEC_PATH'].strip() or 'jobs/auto/spec.json'
          spec = (root / supplied).resolve()
          if not spec.is_relative_to(root) or not spec.is_file():
              raise SystemExit(f'Job JSON not found inside repository: {spec}')
          if not (root / 'gen_images.py').is_file() or not (root / 'shorts.py').is_file():
              raise SystemExit('Add gen_images.py and shorts.py to the repository root')
          data = json.loads(spec.read_text(encoding='utf-8'))
          if not data.get('segments') or not data.get('slug'):
              raise SystemExit('Job JSON must include slug and nonempty segments')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'spec={spec}\n')
              f.write(f'job_dir={spec.parent}\n')
          print('Job:', spec, 'Segments:', len(data['segments']))
          PY

      - name: Cache Kokoro model and voices
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v1.0-int8-model-files-v1.0

      - name: Download Kokoro model files (when missing)
        run: |
          mkdir -p "$KOKORO_DIR"
          MODEL_BASE='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0'
          if [ ! -s "$KOKORO_DIR/kokoro-v1.0.int8.onnx" ]; then
            curl -fL --retry 4 --retry-delay 5 \
              "$MODEL_BASE/kokoro-v1.0.int8.onnx" \
              -o "$KOKORO_DIR/kokoro-v1.0.int8.onnx"
          fi
          if [ ! -s "$KOKORO_DIR/voices-v1.0.bin" ]; then
            curl -fL --retry 4 --retry-delay 5 \
              "$MODEL_BASE/voices-v1.0.bin" \
              -o "$KOKORO_DIR/voices-v1.0.bin"
          fi

      - name: Generate missing images with Cloudflare FLUX
        run: |
          python gen_images.py "${{ steps.paths.outputs.job_dir }}"

      - name: Assemble Short with Kokoro narration
        run: |
          mkdir -p render_output
          python shorts.py "${{ steps.paths.outputs.spec }}" render_output

      - name: Validate MP4 output
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          videos = list(Path('render_output').glob('*.mp4'))
          if not videos:
              raise SystemExit('No MP4 generated in render_output')
          for video in videos:
              if video.stat().st_size == 0:
                  raise SystemExit(f'Empty MP4: {video}')
              subprocess.run(['ffprobe', '-v', 'error', '-select_streams', 'v:0',
                              '-show_entries', 'stream=width,height,codec_name',
                              '-of', 'default=noprint_wrappers=1', str(video)], check=True)
              print('Generated:', video, video.stat().st_size, 'bytes')
          PY

      - name: Upload generated storyboard and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-${{ github.run_id }}
          path: |
            jobs/auto/*.json
            jobs/auto/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload MP4 as Actions artifact (no Git push)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name || 'ai-short' }}-${{ github.run_id }}
          path: render_output/*.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish YouTube Short (PUBLIC)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          spec=json.loads(Path(os.environ['SPEC_FILE']).read_text(encoding='utf-8'))
          path=Path('render_output')/(spec['slug']+'.mp4')
          if not path.is_file():
              raise SystemExit(f'Missing expected MP4: {path}')
          print(path)
          PY
          VIDEO_PATH=$(python -c 'import json,os; from pathlib import Path; s=json.load(open(os.environ["SPEC_FILE"])); print(Path("render_output")/(s["slug"]+".mp4"))')
          python upload_youtube.py "$SPEC_FILE" "$VIDEO_PATH"
        env:
          SPEC_FILE: ${{ steps.paths.outputs.spec }}

      - name: Save YouTube upload details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-upload-${{ github.run_id }}
          path: youtube-upload.json
          if-no-files-found: ignore
          retention-days: 7
